name: License Compliance Check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'common/**'
      - '.github/workflows/license-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'common/**'
      - '.github/workflows/license-check.yml'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  license-check:
    runs-on: ubuntu-latest
    name: License Compliance Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          pip install pip-audit license-expression

      - name: Extract C/C++ source files
        run: |
          find src common -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) > source-files.txt
          echo "=== Source files found ==="
          head -20 source-files.txt
          echo "Total files: $(wc -l < source-files.txt)"

      - name: Generate SPDX License Report
        run: |
          python3 << 'EOF'
          import os
          import re
          import json
          from collections import defaultdict

          # Common SPDX license identifiers found in headers
          LICENSE_PATTERNS = {
              r'MIT': 'MIT',
              r'Apache License 2\.0|Apache-2\.0': 'Apache-2.0',
              r'Apache License 2\.0 OR MIT': 'Apache-2.0 OR MIT',
              r'BSD-2-Clause|BSD 2-Clause': 'BSD-2-Clause',
              r'BSD-3-Clause|BSD 3-Clause': 'BSD-3-Clause',
              r'ISC': 'ISC',
              r'MPL-2\.0|Mozilla Public License 2\.0': 'MPL-2.0',
              r'LGPL-2\.0-or-later|LGPL-2\.0\+': 'LGPL-2.0-or-later',
              r'LGPL-2\.1-or-later|LGPL-2\.1\+': 'LGPL-2.1-or-later',
              r'LGPL-3\.0-or-later|LGPL-3\.0\+': 'LGPL-3.0-or-later',
              r'GPL-2\.0|GPL-2\.0-only': 'GPL-2.0-only',
              r'GPL-3\.0|GPL-3\.0-only': 'GPL-3.0-only',
              r'AGPL-3\.0': 'AGPL-3.0-or-later',
          }

          file_licenses = {}
          detected_licenses = defaultdict(list)

          with open('source-files.txt', 'r') as f:
              files = f.read().strip().split('\n')

          print(f"Scanning {len(files)} source files for license headers...")

          for filepath in files:
              if not os.path.exists(filepath):
                  continue

              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read(2000)  # Read first 2KB for license header
              except:
                  continue

              detected = None

              # Check for license patterns in header
              for pattern, spdx_id in LICENSE_PATTERNS.items():
                  if re.search(pattern, content, re.IGNORECASE):
                      detected = spdx_id
                      detected_licenses[spdx_id].append(filepath)
                      break

              if not detected:
                  # Default to MIT if no license found (common for TDengine projects)
                  detected = 'MIT'
                  detected_licenses['MIT'].append(filepath)

              file_licenses[filepath] = detected

          # Generate report
          with open('license-report.txt', 'w') as f:
              f.write("=" * 80 + "\n")
              f.write("License Compliance Report - TDengine ODBC Connector\n")
              f.write("=" * 80 + "\n\n")

              f.write("Detected License Distribution:\n")
              f.write("-" * 80 + "\n")
              for license, files in sorted(detected_licenses.items()):
                  f.write(f"\n{license}:\n")
                  f.write(f"  Files: {len(files)}\n")
                  if len(files) <= 5:
                      for file in files:
                          f.write(f"    - {file}\n")
                  else:
                      for file in files[:3]:
                          f.write(f"    - {file}\n")
                      f.write(f"    ... and {len(files)-3} more files\n")

              f.write("\n" + "=" * 80 + "\n")
              f.write("Summary:\n")
              f.write("-" * 80 + "\n")
              f.write(f"Total files scanned: {len(files)}\n")
              f.write(f"Total licenses detected: {len(detected_licenses)}\n")

          # Save as JSON for further processing
          with open('source-licenses.json', 'w') as f:
              json.dump({
                  'total_files': len(files),
                  'licenses': {k: len(v) for k, v in detected_licenses.items()},
                  'detailed': file_licenses
              }, f, indent=2)

          print("✅ Generated license report")
          with open('license-report.txt', 'r') as f:
              print(f.read())
          EOF

      - name: Analyze CMake dependencies for licenses
        run: |
          python3 << 'EOF'
          import re
          import json
          import os

          # Known licenses for system C libraries
          KNOWN_LICENSES = {
              'iconv': 'LGPL-2.1-or-later',
              'taos': 'AGPL-3.0-or-later',  # TDengine is AGPL
              'taosws': 'AGPL-3.0-or-later',
          }

          deps_licenses = {}

          # Parse CMakeLists.txt
          cmake_files = ['CMakeLists.txt', 'src/CMakeLists.txt', 'common/CMakeLists.txt']

          for cmake_file in cmake_files:
              if not os.path.exists(cmake_file):
                  continue

              with open(cmake_file, 'r') as f:
                  content = f.read()

              # Extract find_package, pkg_check_modules, and link_libraries
              for match in re.finditer(r'find_package\s*\(\s*(\w+)', content):
                  pkg = match.group(1)
                  if pkg in KNOWN_LICENSES:
                      deps_licenses[pkg] = KNOWN_LICENSES[pkg]

              for match in re.finditer(r'pkg_check_modules\s*\([^)]*\s+([A-Za-z0-9_\-]+)', content):
                  pkg = match.group(1)
                  if pkg in KNOWN_LICENSES:
                      deps_licenses[pkg] = KNOWN_LICENSES[pkg]

              for match in re.finditer(r'link_libraries\s*\(([^)]+)\)', content):
                  libs = match.group(1).split()
                  for lib in libs:
                      if lib in KNOWN_LICENSES:
                          deps_licenses[lib] = KNOWN_LICENSES[lib]

          with open('dependencies-licenses.json', 'w') as f:
              json.dump(deps_licenses, f, indent=2)

          print("CMake Dependencies Licenses:")
          for pkg, lic in sorted(deps_licenses.items()):
              print(f"  {pkg}: {lic}")
          EOF

      - name: Merge license information
        run: |
          python3 << 'EOF'
          import json

          # Merge source file licenses and dependency licenses
          with open('source-licenses.json', 'r') as f:
              source_data = json.load(f)

          with open('dependencies-licenses.json', 'r') as f:
              deps_data = json.load(f)

          merged = {
              'source_code': source_data['licenses'],
              'dependencies': deps_data,
              'total_files': source_data['total_files'],
              'detailed_source': source_data['detailed']
          }

          with open('merged-licenses.json', 'w') as f:
              json.dump(merged, f, indent=2)

          print("✅ Merged all license information")
          EOF

      - name: Generate comprehensive license report
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime
          import textwrap

          with open('merged-licenses.json', 'r') as f:
              data = json.load(f)

          # Define allowed and prohibited licenses
          ALLOWED_LICENSES = {
              'MIT',
              'Apache-2.0',
              'Apache-2.0 OR MIT',
              'BSD-2-Clause',
              'BSD-3-Clause',
              'ISC',
              'MPL-2.0',
              'LGPL-2.0-or-later',
              'LGPL-2.1-or-later',
              'LGPL-3.0-or-later',
          }

          # Internal TDengine ecosystem libraries (exceptions to license restrictions)
          INTERNAL_ECOSYSTEM_LIBS = {
              'taos',
              'taosws',
          }

          PROHIBITED_LICENSES = {
              'GPL-2.0-only',
              'GPL-3.0-only',
              'AGPL-3.0-or-later',  # Prohibited EXCEPT for taos/taosws (internal ecosystem)
              'SSPL',
          }

          FLAGGED_LICENSES = {
              # AGPL flagged for review when found in external dependencies
              'AGPL-3.0-or-later',
          }

          # Analyze licenses
          source_licenses = data.get('source_code', {})
          deps_licenses = data.get('dependencies', {})

          all_licenses = set()
          all_licenses.update(source_licenses.keys())
          all_licenses.update(deps_licenses.values())

          report = textwrap.dedent(f"""
          # License Compliance Report

          **Generated**: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}
          **Project**: TDengine ODBC Connector
          **Scan Type**: Source Code + CMake Dependencies (C/C++)

          ## Summary

          - Source files scanned: {data.get('total_files', 0)}
          - Unique licenses found: {len(all_licenses)}

          ## License Distribution

          ### Source Code Licenses

          """)

          if source_licenses:
              for lic, count in sorted(source_licenses.items()):
                  report += f"- **{lic}**: {count} files\n"
          else:
              report += "- MIT: All files (default)\n"

          report += "\n### CMake Dependencies Licenses\n\n"

          if deps_licenses:
              for pkg, lic in sorted(deps_licenses.items()):
                  if pkg in INTERNAL_ECOSYSTEM_LIBS:
                      status = "ℹ️"
                  else:
                      status = "🟢" if lic in ALLOWED_LICENSES else "🟡" if lic in FLAGGED_LICENSES else "🔴"
                  report += f"- {status} {pkg}: {lic}\n"
          else:
              report += "- None detected\n"

          # License analysis
          report += "\n## License Compliance Analysis\n\n"

          # Check for violations
          # AGPL is prohibited EXCEPT for internal TDengine libraries (taos/taosws)
          prohibited_found = []
          flagged_found = []
          internal_ecosystem_found = []

          for pkg, lic in deps_licenses.items():
              if pkg in INTERNAL_ECOSYSTEM_LIBS:
                  # Internal ecosystem libraries are allowed even with AGPL
                  internal_ecosystem_found.append((pkg, lic))
              elif lic in PROHIBITED_LICENSES:
                  prohibited_found.append(f"{pkg} ({lic})")
              elif lic in FLAGGED_LICENSES and pkg not in INTERNAL_ECOSYSTEM_LIBS:
                  flagged_found.append(f"{pkg} ({lic})")

          # Check source code for violations (not license type but presence)
          for lic in source_licenses.keys():
              if lic in PROHIBITED_LICENSES:
                  prohibited_found.append(lic)
              elif lic in FLAGGED_LICENSES:
                  flagged_found.append(lic)

          if internal_ecosystem_found:
              report += "### ℹ️ Internal TDengine Ecosystem Libraries (Exceptions to License Restrictions)\n\n"
              report += "These libraries are part of TDengine and are **exceptions** to license restrictions:\n"
              for pkg, lic in internal_ecosystem_found:
                  report += f"- {pkg}: {lic} (allowed as internal TDengine dependency)\n"
              report += "\n"

          if prohibited_found:
              report += "### ⛔ Prohibited Licenses Found\n\n"
              for item in prohibited_found:
                  report += f"- {item}\n"
              report += "\nThese licenses are not compatible with the project distribution.\n\n"

          if flagged_found:
              report += "### ⚠️ Flagged Licenses (Review Required)\n\n"
              report += "Note: Internal TDengine libraries are not included in flagged analysis.\n\n"
              for item in flagged_found:
                  report += f"- {item}\n"
              report += "\nThese are copyleft licenses that require special handling:\n"
              report += "- Ensure all source code modifications are properly disclosed\n"
              report += "- Include full license text in distributions\n"
              report += "- Document usage in project materials\n\n"

          # Allowed licenses summary
          allowed_found = [l for l in all_licenses if l in ALLOWED_LICENSES]
          if allowed_found:
              report += f"### ✅ Allowed Licenses ({len(allowed_found)} types)\n\n"
              for lic in sorted(allowed_found):
                  report += f"- {lic}\n"

          report += "\n## Recommended License for Project\n\n"
          report += textwrap.dedent("""
              For the TDengine ODBC Connector, we recommend:

              **Option 1: Dual License**
              - **Primary**: AGPL-3.0-or-later (matching TDengine server)
              - **Rationale**: ODBC driver closely integrates with TDengine

              **Option 2: Compatible Permissive License**
              - **Primary**: MIT or Apache-2.0 (for broader adoption)
              - **Requirement**: Document AGPL dependencies explicitly

              Note: The project currently uses system libraries with AGPL requirements,
              which typically applies to linked/compiled binaries. Consult legal for final decision.
          """)

          report += "\n---\n"
          report += "\n**Allowed Licenses**: MIT, Apache-2.0, BSD-2/3-Clause, ISC, MPL-2.0, LGPL-2/3\n"
          report += "**Internal Ecosystem Exceptions** (taos, taosws): AGPL-3.0-or-later allowed for these libraries only\n"
          report += "**Prohibited**: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-or-later (except taos/taosws), SSPL\n"

          with open('license-compliance-report.md', 'w') as f:
              f.write(report)

          print(report)

          # Generate JSON summary for CI decisions
          summary = {
              'status': 'OK' if not prohibited_found else 'FAILED',
              'prohibited': prohibited_found,
              'flagged': flagged_found,
              'allowed': allowed_found,
              'total_licenses': len(all_licenses)
          }

          with open('license-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          EOF

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-reports
          path: |
            license-report.txt
            license-compliance-report.md
            source-licenses.json
            dependencies-licenses.json
            merged-licenses.json
            license-summary.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('license-compliance-report.md')) {
              console.log('Report not found');
              return;
            }

            const report = fs.readFileSync('license-compliance-report.md', 'utf8');

            const comment = `## 📜 License Compliance Check

            ${report}

            For detailed analysis, check the artifacts.
            `;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log('Comment posted successfully');
            } catch (e) {
              console.warn('Failed to comment on PR:', e.message || e);
            }

      - name: Check for license violations
        run: |
          python3 << 'EOF'
          import json
          import sys

          with open('license-summary.json', 'r') as f:
              summary = json.load(f)

          if summary['prohibited']:
              print(f"❌ Prohibited licenses found: {summary['prohibited']}")
              sys.exit(1)
          else:
              print("✅ No prohibited licenses found")

              if summary['flagged']:
                  print(f"⚠️  Flagged licenses (review required): {summary['flagged']}")
